name: RasoRead CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend tests ────────────────────────────────────────────────────────────
  api-test:
    name: API Tests (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rasoread
          POSTGRES_PASSWORD: rasoread
          POSTGRES_DB: rasoread_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libmagic1

      - name: Install Python dependencies
        working-directory: apps/api
        run: |
          pip install -r requirements.txt
          pip install -r tests/requirements-test.txt

      - name: Run tests
        working-directory: apps/api
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          REDIS_URL: redis://localhost:6379/15
          JWT_SECRET: ci-test-secret
          STORAGE_BACKEND: local
          LOCAL_STORAGE_PATH: /tmp/rasoread_ci
          OPENAI_API_KEY: ""
          ELEVENLABS_API_KEY: ""
        run: pytest tests/ -v --tb=short

  # ── Frontend lint + build ─────────────────────────────────────────────────────
  web-build:
    name: Frontend Build (Next.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  # ── Docker build check ────────────────────────────────────────────────────────
  docker-check:
    name: Docker Compose Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose
        run: docker compose config --quiet

  # ── Deploy (main branch only) ────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: [api-test, web-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy API to Railway
        run: echo "Add Railway deploy action here — see https://docs.railway.app/guides/github-actions"
        # Example:
        # uses: bervProject/railway-deploy@main
        # with:
        #   railway_token: ${{ secrets.RAILWAY_TOKEN }}
        #   service: api

      - name: Deploy Web to Vercel
        run: echo "Add Vercel deploy action here"

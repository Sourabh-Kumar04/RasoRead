services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://rasoread:rasoread@postgres:5432/rasoread
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: db
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-rasoread-local}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-supersecretchangeme}
      ENVIRONMENT: development
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: celery -A core.celery_app worker --loglevel=info --concurrency=4
    environment:
      PYTHONPATH: /app
      STORAGE_BACKEND: db
      DATABASE_URL: postgresql+asyncpg://rasoread:rasoread@postgres:5432/rasoread
      REDIS_URL: redis://redis:6379/0
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-rasoread-local}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-supersecretchangeme}
      ENVIRONMENT: development
    volumes:
      - ./apps/api:/app
    depends_on:
      - postgres
      - redis

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rasoread
      POSTGRES_PASSWORD: rasoread
      POSTGRES_DB: rasoread
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rasoread"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
